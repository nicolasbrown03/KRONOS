<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRONOS 3.0 — Acceso</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0a0e18;font-family:'Segoe UI',system-ui,sans-serif;padding:16px}
.wrap{width:100%;max-width:380px}
.brand{text-align:center;margin-bottom:40px}
.brand-name{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px}
.brand-name span{color:#fff;opacity:.5;font-weight:400}
.brand-sub{font-size:13px;color:rgba(255,255,255,.4);margin-top:6px;letter-spacing:.02em}
.card{background:#131b2e;border:1px solid rgba(255,255,255,.08);border-radius:20px;
  padding:32px;box-shadow:0 32px 80px rgba(0,0,0,.6)}
.field{margin-bottom:20px}
.field label{display:block;font-size:12px;font-weight:700;color:rgba(255,255,255,.5);
  margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase}
.field input{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.1);
  border-radius:12px;background:rgba(255,255,255,.05);color:#fff;font-size:15px;
  outline:none;transition:border .15s,background .15s}
.field input::placeholder{color:rgba(255,255,255,.25)}
.field input:focus{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.08)}
.btn{width:100%;padding:15px;background:#fff;color:#0a0e18;border:none;
  border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;
  margin-top:8px;letter-spacing:-.01em;transition:opacity .15s,transform .08s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.alert{padding:12px 14px;border-radius:10px;font-size:13px;font-weight:600;
  margin-bottom:16px;display:none;background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.footer{text-align:center;margin-top:24px;font-size:12px;color:rgba(255,255,255,.2)}
.divider{border:none;border-top:1px solid rgba(255,255,255,.06);margin:24px 0}
.link-mark{text-align:center;margin-top:16px}
.link-mark a{font-size:13px;color:rgba(255,255,255,.4);text-decoration:none;
  transition:color .15s}
.link-mark a:hover{color:rgba(255,255,255,.8)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-name">KRONOS <span>3.0</span></div>
    <div class="brand-sub">Sistema de control de asistencia · SOMOS</div>
  </div>
  <div class="card">
    <div class="alert" id="alertEl"></div>
    <div class="field">
      <label>ID / Cédula</label>
      <input id="empId" type="text" placeholder="Sin puntos ni comas" inputmode="numeric" autocomplete="username">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="btnLogin" onclick="doLogin()">Ingresar →</button>
    <hr class="divider">
    <div class="link-mark"><a href="/mark.html">← Ir a marcación de asistencia</a></div>
  </div>
  <div class="footer">Solo para administradores y líderes</div>
</div>
<script>
const API='';
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('empId').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pass').focus();});
function showErr(msg){const el=document.getElementById('alertEl');el.textContent=msg;el.style.display='block';}
async function doLogin(){
  const empId=document.getElementById('empId').value.trim();
  const pass=document.getElementById('pass').value;
  const btn=document.getElementById('btnLogin');
  document.getElementById('alertEl').style.display='none';
  if(!empId||!pass){showErr('Ingresa tu ID y contraseña.');return;}
  btn.disabled=true;btn.textContent='Verificando...';
  try{
    const res=await fetch(API+'/api/auth/login',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({employee_id:empId,password:pass})});
    const data=await res.json();
    if(data.ok){
      localStorage.setItem('kr_token',data.token);
      localStorage.setItem('kr_user',JSON.stringify(data.user));
      window.location.href=['super_admin','admin','leader'].includes(data.user.role)?'/admin.html':'/mark.html';
    }else{showErr(data.message||'Credenciales incorrectas.');}
  }catch(e){showErr('Error de conexión.');}
  btn.disabled=false;btn.textContent='Ingresar →';
}
const tok=localStorage.getItem('kr_token');
if(tok){const u=JSON.parse(localStorage.getItem('kr_user')||'{}');
  if(['super_admin','admin','leader'].includes(u.role))window.location.href='/admin.html';
}
</script>
</body>
</html>
