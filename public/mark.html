<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRONOS 3.0 — Marcacion</title>
<style>
:root{--pri:#3b82f6;--pri-d:#1d4ed8;--ok:#10b981;--ok-d:#059669;
      --warn:#f59e0b;--err:#ef4444;--bg:#0a0e18;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;padding:16px}
.shell{width:100%;max-width:440px}
.card{background:var(--card);border-radius:22px;padding:24px;
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.header h2{font-size:16px;font-weight:800;color:#0a0e18}
.time-badge{font-size:13px;font-weight:700;background:#f1f5f9;padding:5px 10px;
  border-radius:20px;color:#334155;font-variant-numeric:tabular-nums}
.panel{margin-top:0;padding:16px;border-radius:14px;background:#f8fafc;
  border:1px solid #e2e8f0;margin-bottom:14px}
.panel-title{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:#334155;margin-bottom:10px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;font-weight:700;color:#0f172a;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;
  border:1.5px solid #e2e8f0;background:#fff;color:#0f172a;font-size:15px;outline:none;transition:border .15s}
.field input:focus,.field select:focus{border-color:var(--pri)}
.btn-search{width:100%;padding:13px;border:none;border-radius:12px;font-size:14px;
  font-weight:700;cursor:pointer;background:linear-gradient(180deg,#475569,#334155);
  color:#fff;margin-top:8px}
.user-panel{background:#ecfdf5;border:1px solid #bbf7d0;border-radius:12px;
  padding:12px 14px;margin-bottom:14px;display:none}
.user-panel.visible{display:block}
.user-name{font-size:15px;font-weight:700;color:#065f46}
.user-meta{font-size:12px;color:#047857;margin-top:2px}
.status-box{border-radius:14px;padding:13px 15px;margin-bottom:14px;display:flex;
  align-items:flex-start;gap:10px;min-height:56px;font-size:14px;font-weight:600;
  white-space:pre-wrap;line-height:1.4}
.s-info  {background:#eef2ff;border:1px solid #c7d2fe;color:#1e293b}
.s-ok    {background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46}
.s-warn  {background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.s-error {background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
.s-emoji {font-size:18px;flex:0 0 22px;margin-top:1px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btns-secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
button{border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
  padding:13px 10px;transition:opacity .15s,transform .05s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-entry {background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff}
.btn-exit  {background:linear-gradient(180deg,var(--ok),var(--ok-d));color:#fff}
.btn-lunch {background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;font-size:13px}
.btn-reset {width:100%;background:#f8fafc;color:#64748b;border:1px solid #e2e8f0;
  font-size:13px;margin-top:4px;display:none}
.footer-note{padding:11px 13px;border-radius:12px;background:rgba(248,250,252,.9);
  border:1px dashed #cbd5e1;color:#64748b;font-size:12px;line-height:1.5}
.admin-link{font-size:12px;color:#94a3b8;text-align:center;margin-top:12px;cursor:pointer}
.admin-link a{color:#3b82f6;text-decoration:none}
.select-loading{color:#94a3b8}
@media(max-width:420px){.btns,.btns-secondary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<div class="card">
  <div class="header">
    <h2>⚡ KRONOS 3.0</h2>
    <div class="time-badge" id="clock">--:--</div>
  </div>

  <!-- Identificacion -->
  <div class="panel">
    <div class="panel-title">Identificacion</div>
    <div class="field">
      <label for="empId">ID del colaborador (cedula)</label>
      <input type="text" id="empId" placeholder="Sin puntos ni comas" inputmode="numeric" autocomplete="off">
    </div>
    <div class="field">
      <label for="ecosystem">Ecosistema</label>
      <select id="ecosystem" class="select-loading">
        <option value="">Cargando...</option>
      </select>
    </div>
    <button class="btn-search" id="btnBuscar" onclick="buscarColaborador()">🔎 Confirmar</button>
  </div>

  <!-- Info colaborador confirmado -->
  <div class="user-panel" id="userPanel">
    <div class="user-name" id="userName"></div>
    <div class="user-meta" id="userMeta"></div>
  </div>

  <!-- Estado -->
  <div class="status-box s-info" id="statusBox">
    <div class="s-emoji">ℹ️</div>
    <div id="statusText">Ingresa tu ID y ecosistema, luego confirma.</div>
  </div>

  <!-- Botones de marcacion -->
  <div class="btns">
    <button class="btn-entry" id="btnEntry" onclick="marcar('entry')" disabled>📥 Entrada</button>
    <button class="btn-exit"  id="btnExit"  onclick="marcar('exit')"  disabled>📤 Salida</button>
  </div>
  <div class="btns-secondary">
    <button class="btn-lunch" id="btnLunchOut" onclick="marcar('lunch_out')" disabled>🍽 Salir almuerzo</button>
    <button class="btn-lunch" id="btnLunchIn"  onclick="marcar('lunch_in')"  disabled>☕ Volver almuerzo</button>
  </div>
  <button class="btn-reset" id="btnReset" onclick="resetForm()">↩ Marcar otro colaborador</button>

  <div class="footer-note" id="footerNote">
    La ubicacion puede ser solicitada segun tu area de trabajo.
  </div>
  <div class="admin-link"><a href="/login.html">Acceso administradores</a></div>
</div>
</div>

<script>
const API = '';
let busy = false;
let confirmedUser = null;

// Reloj
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000); updateClock();

// Cargar ecosistemas
fetch(API + '/api/public/areas')
  .then(r => r.json())
  .then(d => {
    const sel = document.getElementById('ecosystem');
    sel.className = '';
    sel.innerHTML = '<option value="">Selecciona tu area...</option>';
    (d.areas || []).forEach(a => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = a;
      sel.appendChild(opt);
    });
  }).catch(() => {
    // Fallback
    const sel = document.getElementById('ecosystem');
    sel.className = '';
    sel.innerHTML = '<option value="">Selecciona...</option>';
    ['Instalaciones','Sac','Ventas','Ventas Bog','Accounting and treasury',
     'Soporte N2','Soporte en sitio','CEDI','Relevamiento','Noc'].forEach(a => {
      const opt = document.createElement('option');
      opt.value = opt.textContent = a;
      sel.appendChild(opt);
    });
  });

// Buscar y confirmar colaborador
async function buscarColaborador() {
  if (busy) return;
  const id  = document.getElementById('empId').value.trim();
  const eco = document.getElementById('ecosystem').value;
  if (!id || !eco) { setStatus('s-warn','⚠️','Ingresa tu ID y selecciona tu ecosistema.'); return; }

  busy = true;
  document.getElementById('btnBuscar').disabled = true;
  setStatus('s-info','⏳','Verificando...');

  try {
    const res = await fetch(`${API}/api/public/employee/${id}?ecosystem=${encodeURIComponent(eco)}`);
    const d = await res.json();
    if (d.ok) {
      confirmedUser = { id, ecosystem: eco, full_name: d.employee.full_name, cargo: d.employee.cargo };
      document.getElementById('userPanel').classList.add('visible');
      document.getElementById('userName').textContent = d.employee.full_name;
      document.getElementById('userMeta').textContent = d.employee.cargo + ' · ' + eco;
      setAllEnabled(true);
      setStatus('s-ok','✅','Listo ' + d.employee.full_name.split(' ')[0] + '. Selecciona tu marcacion.');
      document.getElementById('footerNote').textContent =
        geoObligatoria(eco) ? '📍 Tu area requiere ubicacion obligatoria.' :
        requiereGeo(eco)    ? '📍 Se solicitara tu ubicacion como referencia.' :
        'Marcacion sin requisito de ubicacion.';
    } else {
      confirmedUser = null;
      setStatus('s-error','⛔', d.message || 'ID o ecosistema no encontrado.');
      setAllEnabled(false);
    }
  } catch(e) {
    setStatus('s-error','⛔','Error de conexion. Verifica tu red.');
    setAllEnabled(false);
  }
  busy = false;
  document.getElementById('btnBuscar').disabled = false;
}

// Marcar
async function marcar(type) {
  if (busy || !confirmedUser) return;
  busy = true;
  setAllEnabled(false);

  const eco = confirmedUser.ecosystem;
  const bloqueaSin = geoObligatoria(eco);
  const pideGeo    = requiereGeo(eco);

  if (bloqueaSin) setStatus('s-info','📍','Solicitando ubicacion obligatoria...');
  else setStatus('s-info','⏳','Registrando...');

  try {
    const [ipData, geoData] = await Promise.all([getIP(), pideGeo ? getGeo() : Promise.resolve({lat:null,lon:null})]);

    if (bloqueaSin && (!geoData.lat || !geoData.lon)) {
      setStatus('s-error','❌','No se pudo obtener tu ubicacion.\n1. Activa el GPS\n2. Permite ubicacion en el navegador\n3. Reintenta');
      busy = false; setAllEnabled(true); return;
    }

    const res = await fetch(API + '/api/public/mark', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        employee_id: confirmedUser.id,
        ecosystem: confirmedUser.ecosystem,
        type,
        lat: geoData.lat, lon: geoData.lon,
        geo_accuracy_m: geoData.accuracy,
        ip_address: ipData.ip,
        ip_data: ipData
      })
    });
    const d = await res.json();

    if (d.ok) {
      const isWarn = d.message && d.message.includes('Tardanza');
      setStatus(isWarn ? 's-warn' : 's-ok', isWarn ? '⚠️' : '✅', d.message);
      document.getElementById('btnReset').style.display = 'block';
      setAllEnabled(false);
    } else {
      const isWarn = d.message && (d.message.includes('ya tienes') || d.message.includes('cerrada') || d.message.includes('Intervalo') || d.message.includes('maximo'));
      setStatus(isWarn ? 's-warn' : 's-error', isWarn ? '⚠️' : '⛔', d.message);
      setAllEnabled(true);
    }
  } catch(e) {
    setStatus('s-error','⛔','Error de conexion.');
    setAllEnabled(true);
  }
  busy = false;
}

function resetForm() {
  confirmedUser = null;
  document.getElementById('empId').value = '';
  document.getElementById('ecosystem').value = '';
  document.getElementById('userPanel').classList.remove('visible');
  document.getElementById('btnReset').style.display = 'none';
  setAllEnabled(false);
  setStatus('s-info','ℹ️','Ingresa tu ID y ecosistema, luego confirma.');
  document.getElementById('empId').focus();
}

function setStatus(cls, emoji, text) {
  const box = document.getElementById('statusBox');
  box.className = 'status-box ' + cls;
  box.innerHTML = '<div class="s-emoji">' + emoji + '</div><div id="statusText">' + text + '</div>';
}

function setAllEnabled(state) {
  ['btnEntry','btnExit','btnLunchOut','btnLunchIn'].forEach(id => {
    document.getElementById(id).disabled = !state;
  });
}

// Geo helpers
function requiereGeo(eco) {
  return ['soporte en sitio','instalaciones','ventas bog','accounting and treasury']
    .includes((eco||'').toLowerCase().trim());
}
function geoObligatoria(eco) {
  return ['soporte en sitio','ventas bog','accounting and treasury']
    .includes((eco||'').toLowerCase().trim());
}

async function getIP() {
  try {
    const r = await fetch('https://ipapi.co/json/', {signal: AbortSignal.timeout(3000)});
    return await r.json();
  } catch { return {ip:'N/A'}; }
}

async function getGeo() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve({lat:null,lon:null,accuracy:null}); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy}),
      () => resolve({lat:null,lon:null,accuracy:null}),
      {enableHighAccuracy:true, timeout:8000, maximumAge:0}
    );
  });
}

// Enter en campo ID confirma
document.getElementById('empId').addEventListener('keydown', e => {
  if (e.key === 'Enter') buscarColaborador();
});
document.getElementById('ecosystem').addEventListener('change', () => {
  confirmedUser = null;
  document.getElementById('userPanel').classList.remove('visible');
  setAllEnabled(false);
});
</script>
</body>
</html>
