<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRONOS 3.0 — Marcación</title>
<style>
:root{--pri:#3b82f6;--pri-d:#1d4ed8;--ok:#10b981;--ok-d:#059669;
      --warn:#f59e0b;--err:#ef4444;--bg:#0a0e18;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;padding:16px}
.shell{width:100%;max-width:440px}
.card{background:var(--card);border-radius:22px;padding:24px;
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.header h2{font-size:16px;font-weight:800;color:#0a0e18}
.time-badge{font-size:13px;font-weight:700;background:#f1f5f9;padding:5px 10px;
  border-radius:20px;color:#334155;font-variant-numeric:tabular-nums}
.user-panel{background:#f8fafc;border-radius:14px;padding:14px 16px;margin-bottom:16px;
  border:1px solid #e2e8f0}
.user-name{font-size:15px;font-weight:700;color:#0f172a}
.user-meta{font-size:12px;color:#64748b;margin-top:2px}
.status-box{border-radius:14px;padding:13px 15px;margin-bottom:16px;display:flex;
  align-items:flex-start;gap:10px;min-height:58px;font-size:14px;font-weight:600;
  white-space:pre-wrap;line-height:1.4}
.s-info   {background:#eef2ff;border:1px solid #c7d2fe;color:#1e293b}
.s-ok     {background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46}
.s-warn   {background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
.s-error  {background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}
.s-emoji  {font-size:18px;flex:0 0 22px;margin-top:1px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btns-secondary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
button{border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;
  padding:13px 10px;transition:opacity .15s,transform .05s}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-entry {background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff}
.btn-exit  {background:linear-gradient(180deg,var(--ok),var(--ok-d));color:#fff}
.btn-lunch {background:#f1f5f9;color:#334155;border:1px solid #e2e8f0;font-size:13px}
.btn-reset {width:100%;background:#f8fafc;color:#64748b;border:1px solid #e2e8f0;
  font-size:13px;margin-top:4px;display:none}
.footer-note{padding:12px 14px;border-radius:12px;background:rgba(248,250,252,.9);
  border:1px dashed #cbd5e1;color:#64748b;font-size:12px;line-height:1.5}
.logout{font-size:12px;color:#94a3b8;text-align:center;margin-top:12px;cursor:pointer}
.logout:hover{color:#64748b}
@media(max-width:420px){.btns,.btns-secondary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<div class="card">
  <div class="header">
    <h2>⚡ KRONOS 3.0</h2>
    <div class="time-badge" id="clock">--:--</div>
  </div>
  <div class="user-panel">
    <div class="user-name" id="userName">Cargando...</div>
    <div class="user-meta" id="userMeta"></div>
  </div>
  <div class="status-box s-info" id="statusBox">
    <div class="s-emoji">ℹ️</div>
    <div id="statusText">Cargando tu información...</div>
  </div>
  <div class="btns">
    <button class="btn-entry" id="btnEntry"  onclick="mark('entry')">📥 Entrada</button>
    <button class="btn-exit"  id="btnExit"   onclick="mark('exit')">📤 Salida</button>
  </div>
  <div class="btns-secondary">
    <button class="btn-lunch" id="btnLunchOut" onclick="mark('lunch_out')">🍽 Salir almuerzo</button>
    <button class="btn-lunch" id="btnLunchIn"  onclick="mark('lunch_in')">☕ Volver almuerzo</button>
  </div>
  <button class="btn-reset" id="btnReset" onclick="refreshStatus()">↩ Ver estado actualizado</button>
  <div class="footer-note" id="footerNote">
    Primero carga tu información. La ubicación puede ser solicitada según tu área.
  </div>
  <div class="logout" onclick="logout()">Cerrar sesión</div>
</div>
</div>

<script>
const API   = '';
let busy    = false;
let userInfo = null;

// ─── Auth ───
const token = localStorage.getItem('kr_token');
const user  = JSON.parse(localStorage.getItem('kr_user') || '{}');
if (!token) { window.location.href = '/login.html'; }

// ─── Reloj ───
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000); updateClock();

// ─── Cargar info de usuario y estado del día ───
async function loadUserInfo() {
  try {
    const [meRes, todayRes] = await Promise.all([
      fetch(`${API}/api/auth/me`,          {headers:{Authorization:`Bearer ${token}`}}),
      fetch(`${API}/api/attendance/today`, {headers:{Authorization:`Bearer ${token}`}})
    ]);
    if (meRes.status === 401) { logout(); return; }

    const me    = await meRes.json();
    const today = await todayRes.json();

    if (me.ok) {
      userInfo = me.user;
      document.getElementById('userName').textContent = me.user.full_name;
      document.getElementById('userMeta').textContent =
        [me.user.cargo, me.user.area, me.user.shift && `Turno: ${me.user.shift}`]
        .filter(Boolean).join(' · ');
    }

    const sess = today.session;
    let msg = '';
    let cls = 's-info';
    let emoji = 'ℹ️';

    if (!sess || !sess.entry_time) {
      msg = 'No has marcado entrada hoy.\nPresiona "Entrada" para iniciar tu jornada.';
    } else if (sess.entry_time && !sess.exit_time) {
      const h = new Date(sess.entry_time).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',timeZone:'America/Bogota'});
      msg = `✅ Jornada activa desde las ${h}.`;
      if (sess.late_minutes > 0) msg += `\n⚠️ Tardanza: ${sess.late_minutes} min.`;
      cls = 's-ok'; emoji = '✅';
    } else if (sess.exit_time) {
      const hi = new Date(sess.entry_time).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',timeZone:'America/Bogota'});
      const ho = new Date(sess.exit_time).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',timeZone:'America/Bogota'});
      msg = `Jornada cerrada — Entrada: ${hi} | Salida: ${ho}\nHoras: ${sess.total_hours||'--'}`;
      cls = 's-info'; emoji = '📋';
    }

    setStatus(cls, emoji, msg);
  } catch(e) {
    setStatus('s-error','⛔','Error cargando información. Recarga la página.');
  }
}
loadUserInfo();

// ─── Marcación ───
async function mark(type) {
  if (busy) return;
  busy = true;
  setAllDisabled(true);
  setStatus('s-info','⏳','Procesando...');

  try {
    const [ipData, geoData] = await Promise.all([getIP(), getGeo()]);

    const res = await fetch(`${API}/api/attendance/mark`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', Authorization:`Bearer ${token}` },
      body: JSON.stringify({
        type,
        lat: geoData.lat, lon: geoData.lon,
        geo_accuracy_m: geoData.accuracy,
        ip_address: ipData.ip,
        ip_data: ipData
      })
    });
    const data = await res.json();

    if (data.ok) {
      setStatus('s-ok','✅', data.message);
      document.getElementById('btnReset').style.display = 'block';
    } else {
      const isWarn = data.message?.includes('⚠️') || data.message?.includes('ya tienes');
      setStatus(isWarn ? 's-warn' : 's-error', isWarn ? '⚠️' : '⛔', data.message);
    }
  } catch(e) {
    setStatus('s-error','⛔','Error de conexión. Verifica tu red e intenta de nuevo.');
  }

  busy = false;
  setAllDisabled(false);
}

async function getIP() {
  try {
    const r = await fetch('https://ipapi.co/json/',{signal:AbortSignal.timeout(3000)});
    return await r.json();
  } catch { return {ip:'N/A'}; }
}

async function getGeo() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve({lat:null,lon:null,accuracy:null}); return; }
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat:p.coords.latitude, lon:p.coords.longitude, accuracy:p.coords.accuracy}),
      () => resolve({lat:null,lon:null,accuracy:null}),
      {enableHighAccuracy:true, timeout:8000, maximumAge:0}
    );
  });
}

function setStatus(cls, emoji, text) {
  const box  = document.getElementById('statusBox');
  const txt  = document.getElementById('statusText');
  box.className = `status-box ${cls}`;
  document.querySelector('.s-emoji').textContent = emoji;
  txt.textContent = text;
}

function setAllDisabled(state) {
  ['btnEntry','btnExit','btnLunchOut','btnLunchIn'].forEach(id => {
    document.getElementById(id).disabled = state;
  });
}

function refreshStatus() {
  document.getElementById('btnReset').style.display = 'none';
  loadUserInfo();
}

function logout() {
  localStorage.removeItem('kr_token');
  localStorage.removeItem('kr_user');
  window.location.href = '/login.html';
}
</script>
</body>
</html>
